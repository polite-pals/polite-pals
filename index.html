<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Yes Sir, Yes Ma'am — Practice</title>
  <meta name="description" content="A parent-and-child app for practicing polite yes sir / no sir / yes ma'am / no ma'am responses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- "Add to Home Screen" support: makes the app installable with its
       own icon and a full-screen (no browser chrome) launch on iPad. -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#FF6B5B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yes Ma'am" />
</head>
<body>
  <div id="app"></div>

  <!-- Face tracking for the Silly Mask Party. MediaPipe FaceLandmarker
       reports facial "blendshapes" (mouth-open, blink, smile) so the
       masks can react to expressions. Loaded from CDN as a module and
       stashed on window for app.js; if it can't load (offline), the
       party falls back to draggable masks. All processing runs
       on-device — no video ever leaves the iPad. -->
  <script type="module">
    import { FaceLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20";
    window.__vision = { FaceLandmarker, FilesetResolver };
    window.dispatchEvent(new Event("vision-ready"));
  </script>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="audio.js"></script>
  <script src="rewards.js"></script>
  <script src="app.js"></script>
</body>
</html>
